  <script>
    let currentLanguage = 'ja';

    function switchLanguage(lang) {
      currentLanguage = lang;
      
      // 言語ボタンのアクティブ状態を更新
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');

      // すべてのテキストを更新
      document.querySelectorAll('[data-ja]').forEach(element => {
        if (lang === 'ja') {
          element.textContent = element.getAttribute('data-ja');
        } else if (lang === 'vi') {
          element.textContent = element.getAttribute('data-vi');
        } else if (lang === 'en') {
          element.textContent = element.getAttribute('data-en');
        }
      });

      // localStorage に言語設定を保存
      localStorage.setItem('selectedLanguage', lang);
    }

    // ページ読み込み時に保存された言語を復元
    window.addEventListener('DOMContentLoaded', () => {
      const savedLanguage = localStorage.getItem('selectedLanguage') || 'ja';
      const langBtn = document.querySelector(`[onclick="switchLanguage('${savedLanguage}')"]`);
      if (langBtn) {
        langBtn.click();
      }
    });

    function downloadFile(url, filename) {
      // raw.githubusercontent.comからの直接ダウンロード
      const rawUrl = url.replace(
        'https://github.com/',
        'https://raw.githubusercontent.com/'
      ).replace('/blob/main/', '/main/');
      
      const link = document.createElement('a');
      link.href = rawUrl;
      link.download = filename || rawUrl.split('/').pop();
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
